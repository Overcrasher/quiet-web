<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you – Quiet Web</title>
<style>
:root{color-scheme:light dark;--bg:#E0F2FE;--surface:#F4FAFF;--line:#BBDDF2;--fg:#0F172A;--muted:#44546B;--accent:#1E293B;--accent-soft:#CDE8FA;--second:#047857;--second-soft:#D3F5E7;--btn-text:#fff;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 30px rgba(15,23,42,.09)}
@media(prefers-color-scheme:dark){:root{--bg:#0B1220;--surface:#131C2E;--line:#26354F;--fg:#E7EEF8;--muted:#9FB0C7;--accent:#34D399;--accent-soft:#17263D;--second:#34D399;--second-soft:#12332B;--btn-text:#0F172A;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.3)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mark{filter:drop-shadow(0 3px 6px rgba(30,41,59,.3))}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:17px}
.card{background:radial-gradient(120% 100% at 50% 0%,var(--accent-soft),var(--surface) 65%);border:1px solid var(--line);max-width:460px;margin:16px;padding:36px 32px;border-radius:24px;text-align:center;box-shadow:var(--shadow)}
.heart{font-size:44px;color:var(--accent);line-height:1;margin-top:14px}
h1{margin:10px 0 12px;font-size:28px;letter-spacing:-.01em}p{color:var(--muted);margin:8px 0}
.by{font-size:13px;margin-top:20px}
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 32 32" width="56" height="56" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2D3E56"/><stop offset="1" stop-color="#162134"/></linearGradient></defs><rect width="32" height="32" rx="7" fill="url(#mk)"/><path d="M6.4 4.5h19.2a3.8 3.8 0 0 1 3.8 3.8v10.8a3.8 3.8 0 0 1-3.8 3.8H15L7 27.4l.9-4.5H6.4a3.8 3.8 0 0 1-3.8-3.8V8.3a3.8 3.8 0 0 1 3.8-3.8z" transform="translate(.6 .3) scale(.96)" fill="#E0F2FE"/><path d="M9 11.2c1.9 3.4 4 3.4 5.4 0M17.8 11.2c1.9 3.4 4 3.4 5.4 0" fill="none" stroke="#1E293B" stroke-width="1.9" stroke-linecap="round"/><rect x="12.2" y="17.6" width="7.6" height="2.2" rx="1.1" fill="#34D399"/></svg>
    <div class="heart" aria-hidden="true">❤</div>
    <h1>Thank you!</h1>
    <p>Your support keeps Quiet Web free, ad-free and tracking-free.</p>
    <p>If the extension is installed, it will now show a small "Supporter ❤" badge in the popup and stop asking.</p>
    <p>Go and enjoy a quieter web.</p>
    <p class="by">by Quantumbyte Labs</p>
  </main>
</body>
</html>
